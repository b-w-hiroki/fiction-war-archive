name: Ginei runtime QA
on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
    paths:
      - "engine/template.html"
      - "engine/common.py"
      - "works/ginei/**"
      - "tools/build.py"
      - "tools/qa_ginei.mjs"
      - "tools/qa_astarte_cards.mjs"
      - ".github/workflows/ginei-runtime-qa.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild site
        run: python3 tools/build.py all
      - name: Install browser
        run: |
          npm init -y
          npm install playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/http.log 2>&1 &
          sleep 2
      - name: Run Ginei browser QA
        run: node tools/qa_ginei.mjs

      - name: Check story cards at mobile widths
        run: node tools/qa_astarte_cards.mjs
      - name: Prepare PR base for visual comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA"
          git worktree add /tmp/fiction-base "$BASE_SHA"
          python3 -m http.server 8001 --directory /tmp/fiction-base/docs >/tmp/base-http.log 2>&1 &
          sleep 2
      - name: Capture and check PR base
        if: github.event_name == 'pull_request'
        env:
          QA_BASE: http://127.0.0.1:8001
          QA_LABEL: before
        run: node tools/qa_astarte_cards.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astarte-card-qa
          path: qa-astarte/
