name: Temporary rebuild generated site
on:
  push:
    branches:
      - fix/sync-generated-site-20261019
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate all pages
        run: python3 tools/build.py all
      - name: Commit generated output
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild docs from current templates'
            git push
          fi
