name: Regenerate compact-HUD pages (temporary)
on:
  push:
    branches: [fix/phase-caption-scroll-reset-qa]
    paths:
      - ".github/workflows/temp-regenerate-caption-scroll.yml"
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-caption-scroll-reset-qa
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/build.py all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate compact mobile HUD across 254 battles"
            git push origin HEAD:fix/phase-caption-scroll-reset-qa
          fi
