name: Unit kinds and range QA
on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/template.html"
      - "works/ginei/battles/astarte.py"
      - "works/kingdom/battles/kankoku.py"
      - "works/gundam-uc0079/battles/odessa.py"
      - "works/gundam-uc0079/battles/garma.py"
      - "works/arslan/battles/atropatene1.py"
      - "tools/qa_unit_kinds.mjs"
      - ".github/workflows/unit-kinds-qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 tools/build.py all
      - run: |
          npm init -y
          npm install playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --directory docs >/tmp/http.log 2>&1 &
          sleep 2
      - run: node tools/qa_unit_kinds.mjs
