name: Validate generated site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild docs
        run: python3 tools/build.py all
      - name: Verify committed generated output
        run: |
          git diff --check
          git diff --exit-code -- docs
          test -f docs/index.html
          test -f docs/CNAME
          grep -qx "fiction-war-archive.birdman-studio.com" docs/CNAME
          ! grep -R '\\n <nav class="archivebar"' engine docs/*/index.html
      - name: Verify search metadata and crawl files
        run: python3 tools/qa_search_metadata.py
      - name: Verify HTTP measurement format
        run: python3 -m unittest tools/test_measure_search_discovery.py
      - name: Report data quality markers
        run: python3 tools/audit_data.py
