<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C.E.戦史</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/budoux@0.9.3/bundle/budoux-ja.min.js"></script>
<style>
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
/* 一覧そのものを年表にする。左の縦線が時の流れ、印の大きさが後世への影響 */
:root{
 --paper:#e9ecef;--ink:#151a22;--sub:#566070;--rule:#c3cad3;--faint:#dde2e8;--seal:#151a22;
 --emp:#a4761a;--all:#17808f;--nob:#6d47ad;--coup:#b03f27;--iser:#1d7c50;--reb:#a8343f;--zeon:#b4452b;--efsf:#2d68be;--parse:#1f7a8c;--lusi:#b0303a;--sind:#b8641a;--turan:#6d47ad;--misr:#9a7a12;--hilmes:#8a3b6e;--serpent:#5a4a6a;--titan:#9a5420;--scout:#22703c;--marley:#8a2a2a;--allied:#2d68be;--gamilas:#2d74be;--earth:#b8641a;--none:#7a7c84;
 --f-m:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--f-g:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10141b;--ink:#e3e7ed;--sub:#97a1b0;--rule:#2f3743;--faint:#1b212b;--seal:#e3e7ed;--emp:#e0ae4a;--all:#56c0cf;--nob:#ad8ae6;--coup:#e8795c;--iser:#5ccd96;--reb:#e66f79;--zeon:#ec7c5f;--efsf:#79abee;--parse:#5cc4d6;--lusi:#e8707a;--sind:#eda15a;--turan:#ad8ae6;--misr:#d9b84a;--hilmes:#d081ad;--serpent:#a596b8;--titan:#e0a070;--scout:#6cc488;--marley:#d87a7a;--allied:#79abee;--gamilas:#7ab8ee;--earth:#eda15a;--none:#8f9198;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10141b;--ink:#e3e7ed;--sub:#97a1b0;--rule:#2f3743;--faint:#1b212b;--seal:#e3e7ed;--emp:#e0ae4a;--all:#56c0cf;--nob:#ad8ae6;--coup:#e8795c;--iser:#5ccd96;--reb:#e66f79;--zeon:#ec7c5f;--efsf:#79abee;--parse:#5cc4d6;--lusi:#e8707a;--sind:#eda15a;--turan:#ad8ae6;--misr:#d9b84a;--hilmes:#d081ad;--serpent:#a596b8;--titan:#e0a070;--scout:#6cc488;--marley:#d87a7a;--allied:#79abee;--gamilas:#7ab8ee;--earth:#eda15a;--none:#8f9198;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-g);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
p,dd{text-wrap:pretty}
h1,h2,.nm b{text-wrap:balance}
.nb{display:inline-block;max-width:100%}
budoux-ja{display:inline}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:36px 56px}
a{color:inherit}
header{border-bottom:2px solid var(--ink);padding-bottom:14px}
header{position:relative}
.switch>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%;border-radius:4px}
.switch>summary::-webkit-details-marker{display:none}
.switch>summary:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
.switch .chev{flex:none;width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;transition:background .15s}
.switch .chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.switch[open] .chev::before{transform:translateY(2px) rotate(-135deg)}
.switch>summary:hover .chev{background:var(--faint)}
.switch{position:relative}
.menu{position:absolute;z-index:10;left:0;width:min(420px,calc(100vw - 32px));top:calc(100% + 6px);background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 14px 36px rgba(0,0,0,.2);padding:0;max-height:min(70vh,calc(100dvh - 120px));overflow-y:auto;overscroll-behavior:contain}
.menu a,.menu button{display:grid;width:100%;text-align:left;font:inherit;background:none;border:0;cursor:pointer;grid-template-columns:1fr auto;gap:0 12px;padding:12px 16px;text-decoration:none;color:var(--ink);border-left:3px solid transparent}
.menu button:hover,.menu a:hover{background:var(--faint)}
.menu button:focus-visible,.menu a:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
.menu :is(a,button) b{font-family:var(--f-m);font-size:18px;font-weight:700;letter-spacing:.04em}
.menu :is(a,button) span{grid-column:1;font-size:12.5px;color:var(--sub)}
.menu :is(a,button) em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:12px;color:var(--sub)}
.menu :is(a,button)[aria-current]{border-left-color:var(--ink);background:var(--faint)}
.menu a.all{position:sticky;top:0;z-index:1;background:var(--paper);border-bottom:1.5px solid var(--ink);grid-template-columns:1fr}
.menu a.all b{font-family:var(--f-g);font-size:14px}
h1{font-family:var(--f-m);font-weight:800;font-size:clamp(28px,6.4vw,40px);letter-spacing:.12em;line-height:1.2;margin:0}
.lead{margin:10px 0 0;font-size:14px;color:var(--sub);line-height:1.85}
/* 凡例と絞り込み */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:10px}
.tabs{display:flex;gap:2px 18px;overflow-x:auto}
.tabs button{flex:none;font:500 14px var(--f-m);color:var(--sub);background:none;border:0;border-bottom:2px solid transparent;padding:4px 0 8px;cursor:pointer;letter-spacing:.05em}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:12.5px;align-items:center}
.key dt{color:var(--sub);white-space:nowrap;align-self:start;line-height:1.9}
.key dd{margin:0;display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;line-height:1.9}
.key dd span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.key .sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.key .mk{width:18px;display:inline-flex;justify-content:center}
.key .mark.m3{width:11px;height:11px}
.mark{display:inline-block;flex:none}
.mark.m3{width:16px;height:16px;transform:rotate(45deg);background:var(--c)}
.mark.m2{width:11px;height:11px;border-radius:50%;background:var(--c)}
.mark.m1{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);background:var(--paper)}
/* 時代 */
.era{margin-top:34px}
.era h2{font-family:var(--f-m);font-weight:700;font-size:20px;letter-spacing:.12em;margin:0 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.era h2 small{font-family:var(--f-g);font-size:13px;font-weight:400;letter-spacing:0;color:var(--sub)}
.era h2 b{font-family:var(--f-m);font-size:14px;color:var(--sub);font-weight:500;letter-spacing:.04em}
/* 行：縦線の上に印 */
.row{position:relative;padding-left:44px}
.row::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--rule)}
.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:4.4em minmax(0,1fr) 7.5em;gap:2px 16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--faint)}
.row>summary::-webkit-details-marker{display:none}
.row>summary:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.row .mark{position:absolute;left:22px;top:23px;transform:translate(-50%,-50%)}
.row .mark.m3{transform:translate(-50%,-50%) rotate(45deg)}
.yr{font-family:var(--f-m);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.5}
.yr small{display:block;font-family:var(--f-g);font-weight:400;font-size:11px;color:var(--sub);white-space:nowrap}
.nm{min-width:0}
.nm b{font-family:var(--f-m);font-weight:700;font-size:16px;line-height:1.5;display:block}
.nm .oc{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:0 12px;line-height:1.6}
.nm .oc>*{white-space:nowrap}
.nm .oc span{font-weight:700}
.nm .oc em{font-style:normal}
.row.big .nm b{font-size:19px}
.row.big .nm .imt{display:block;margin-top:4px;font-size:13.5px;color:var(--ink);line-height:1.6;padding-left:10px;border-left:2px solid var(--seal)}
.nm .imt{display:none}
.loss{font-size:12px;color:var(--sub);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums;padding-top:2px}
.loss b{display:block;font-family:var(--f-m);font-size:18px;color:var(--ink);font-weight:700}
.body{padding:2px 0 20px calc(4.4em + 16px);border-bottom:1px solid var(--faint)}
.body p{margin:10px 0;max-width:58ch}
dl.f{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 12px;font-size:13px}
dl.f dt{color:var(--sub);white-space:nowrap}
dl.f dd{margin:0;min-width:0}
.open3d{display:inline-block;font-family:var(--f-m);font-weight:700;font-size:14px;color:var(--seal);text-decoration:none;border-bottom:1px solid currentColor}
.open3d:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
.open3d small{font-family:var(--f-g);font-weight:400;color:var(--sub);margin-left:6px}
footer{margin-top:44px;border-top:2px solid var(--ink);padding-top:12px;font-size:12.5px;color:var(--sub);display:grid;gap:6px}
footer p{margin:0;max-width:66ch}
.notes{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;line-height:1.7}
.notes dt{white-space:nowrap;color:var(--ink)}
.notes dd{margin:0;min-width:0}
@media (max-width:560px){
 .row{padding-left:36px}.row::before{left:15px}.row .mark{left:16px}
 .row>summary{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
 .yr{grid-column:1/-1;display:flex;gap:8px;align-items:baseline}.yr small{display:inline}
 .body{padding-left:0}
}
</style>
</head>

const DEF="gundam-ce",HUB="../index.html",HUBT="",SITE="フィクション戦史アーカイブ";
(function(){
const $=id=>document.getElementById(id);
const sw=$('switch');document.addEventListener('click',e=>{if(sw.open&&!sw.contains(e.target))sw.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sw.open){sw.open=false;sw.querySelector('summary').focus()}});
const IMPN={3:'歴史を変えた',2:'情勢を動かした',1:'局地的'};
const ph=t=>`<budoux-ja>${t}</budoux-ja>`;
const c=k=>`var(--${k})`;

const Y=b=>{if(CFG.date==='uc'){const m=b.era.match(/(\d{3,4})年/);return m?m[1]:''}return Math.floor(b.uc)};

 $('menu').innerHTML=`<a class="all" href="${HUB}"${HUBT}><b>${SITE}（作品一覧）</b><span>全作品の紹介を見る</span></a>`+Object.entries(WORKS).map(([k,w])=>`<button type="button" data-w="${k}"${k===W?' aria-current="page"':''}><b>${w.short}</b><span>${w.span}　${w.B.length}の${w.unit}</span><em>${k===W?'表示中':'切り替え ›'}</em></button>`).join('');
}
$('menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sw.open=false;if(b.dataset.w!==W){load(b.dataset.w);try{history.replaceState(null,'','#'+W)}catch(_){}window.scrollTo(0,0)}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.textContent;$('tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
function load(w){
 W=w;CFG=WORKS[w];B=CFG.B;ERAS=CFG.eras;NAME=CFG.names;BIG='歴史を変えた'+CFG.unit;cur='すべて';
 document.title=CFG.title;$('ttl').textContent=CFG.title;$('lead').innerHTML=CFG.lead;$('notes').innerHTML=CFG.notes;

  +`<dt>印の色</dt><dd>${CFG.order.filter(k=>B.some(b=>b.wc===k)).map(k=>`<span><span class="sw" style="background:${c(k)}"></span>${k==='none'?NAME.none:NAME[k]+'の勝利'}</span>`).join('')}</dd>`;
 $('tabs').innerHTML=['すべて',BIG,...ERAS.map(e=>e[0])].map(v=>`<button type="button" aria-pressed="${v===cur}">${v}</button>`).join('');
 menu();render();
}
function loss(b){const known=b.s.filter(z=>z.r!=null);if(!known.length)return'<b>—</b>損耗率';const m=known.reduce((a,z)=>z.r>a.r?z:a);return `<b>${m.r}%</b>${m.n}の損耗`}
function row(b){
 const md=CFG.date==='uc'?b.era.match(/年(\d+)月(\d+)?/):null,sub=CFG.date==='uc'?(md?md[1]+'月'+(md[2]?md[2]+'日':''):''):(b.era.includes('／')?b.era.replace(/^.*?／/,''):'');
 const m=b.oc.match(/^(.*?)（(.*)）$/),oc=m?m[1]:b.oc;
 const dead=b.s.flatMap(z=>z.d);
 return `<details class="row${b.im===3?' big':''}"><summary>
  ${mk(b.im,b.wc)}
  <div class="yr">${Y(b)}${sub?`<small>${sub}</small>`:''}</div>
  <div class="nm"><b>${ph(b.t)}</b><span class="oc"><span style="color:${c(b.wc)}">${oc}</span><em>${b.s.map(z=>z.n).join(' 対 ')}</em></span><span class="imt">${ph(b.imt)}</span></div>
  <div class="loss">${loss(b)}</div>
 </summary><div class="body">
  <p>${ph(b.sum)}</p>
  <dl class="f"><dt>後世への影響</dt><dd>${ph(IMPN[b.im]+'。'+b.imt)}</dd>${b.when?`<dt>日時・場所</dt><dd>${ph(b.when)}</dd>`:''}${b.s.map(z=>`<dt style="color:${c(z.c)}">${z.n}</dt><dd>${ph('指揮　'+(z.cm||'不明'))}<br>${ph('兵力　'+(z.b||'不明'))}<br>${ph('損害　'+(z.l||'不明')+(z.r!=null?`（損耗率${z.r}%）`:''))}</dd>`).join('')}${dead.length?`<dt>戦死</dt><dd>${ph(dead.join('、'))}</dd>`:''}${b.refs.map(r=>`<dt>${r.k}</dt><dd>${ph(r.v)}</dd>`).join('')}</dl>

}
