<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北極海海戦 3D俯瞰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#05070c;--panel:rgba(246,244,239,.95);--ink:#20252b;--sub:#616a76;--line:rgba(32,37,43,.16);--emp:#9a7531;--all:#2f7380;--acc:#9a7531}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(17,20,25,.88);--ink:#ece9e2;--sub:#a7adb7;--line:rgba(236,233,226,.16);--emp:#c7a35f;--all:#70a9b2;--acc:#c7a35f}}
:root[data-theme="dark"]{--panel:rgba(9,13,22,.8);--ink:#e6ecf5;--sub:#9aa6ba;--line:rgba(230,236,245,.16);--emp:#79abee;--all:#6cc488;--acc:#79abee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0} @supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden} @supports(height:100dvh){#app{height:100dvh}}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none}
.hud .ui{pointer-events:auto}
.back{display:inline-block;margin:2px 0 0;font-size:12px;font-weight:700;color:var(--sub);text-decoration:none}
.title{position:absolute;top:10px;right:12px;writing-mode:vertical-rl;color:#f3f6fb;text-shadow:0 0 14px rgba(120,170,255,.45);display:flex;gap:6px}
.title b{font-size:30px;font-weight:900;letter-spacing:.18em;line-height:1}
.title span{font-size:11px;letter-spacing:.2em;font-weight:700;color:#b9c6da}
.force{position:absolute;top:10px;left:10px;width:min(68vw,330px);background:var(--panel);padding:8px 10px 7px;border-radius:4px;font-size:11.5px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:max-content 1fr 7.6em;align-items:center;gap:6px;margin:2px 0}
.row .side{font-weight:900;font-size:12.5px;white-space:nowrap}
.row.e .side{color:var(--emp)}.row.a .side{color:var(--all)}
.bar{position:relative;height:6px;background:var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .9s ease}
.row.e .dep{background:var(--emp);opacity:.33}.row.e .fig{background:var(--emp)}
.row.a .dep{background:var(--all);opacity:.33}.row.a .fig{background:var(--all)}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--sub);white-space:nowrap}
.num b{color:var(--ink)}
.note{color:var(--sub);font-size:10.5px;margin-top:3px;line-height:1.5}
.cap{position:absolute;left:0;right:0;margin:0 auto;bottom:102px;width:calc(100% - 20px);max-width:620px;box-sizing:border-box;background:var(--panel);border-radius:4px;padding:10px 14px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--line)}
.cap.in{animation:capIn .6s ease}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.time{display:flex;gap:10px;align-items:baseline;color:var(--acc);font-weight:700;font-size:12px}
.time b{font-size:14px;font-weight:900;letter-spacing:.08em}
.cap h2{font-weight:900;font-size:20px;margin:1px 0 4px;letter-spacing:.1em}
.cap p{margin:0;font-size:13.5px;line-height:1.72}
.seek{position:absolute;left:0;right:0;margin:0 auto;bottom:64px;width:calc(100% - 20px);max-width:620px;height:30px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:var(--panel);padding:0 10px;border-radius:15px;box-sizing:border-box;box-shadow:0 0 0 1px var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.seek span{font-size:10px;font-weight:700;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.seek input{width:100%;height:28px;margin:0;accent-color:var(--acc);cursor:pointer;touch-action:pan-x}
.seek input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tl{position:absolute;left:0;right:0;margin:0 auto;bottom:10px;width:calc(100% - 20px);max-width:620px;display:flex;gap:4px;align-items:center}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--acc);color:#0b0f18;font-size:15px;cursor:pointer}
.steps{flex:1;min-width:0;display:flex;gap:2px;background:var(--panel);border-radius:23px;padding:4px;height:46px;box-sizing:border-box;box-shadow:0 0 0 1px var(--line);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.steps::-webkit-scrollbar{display:none}
.steps button{flex:1;min-width:0;border:none;background:transparent;border-radius:19px;font:700 11px "Zen Kaku Gothic New",sans-serif;color:var(--sub);padding:0;cursor:pointer;white-space:nowrap}
.steps button.done{color:var(--ink)}
.steps button.on{background:var(--ink);color:var(--panel)}
.cam{flex:none;height:46px;padding:0 11px;border-radius:23px;border:none;background:var(--panel);color:var(--ink);font:700 11px "Zen Kaku Gothic New",sans-serif;cursor:pointer;box-shadow:0 0 0 1px var(--line);line-height:1.25}
.cam.off{color:var(--sub)}
.resbtn{display:block;margin-top:5px;width:100%;border:none;background:transparent;color:var(--acc);font:700 11.5px "Zen Kaku Gothic New",sans-serif;text-align:right;padding:2px 0;cursor:pointer}
.res{position:absolute;inset:0;z-index:5;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;display:none}
.res.on{display:block;animation:capIn .4s ease}
.res .in{max-width:620px;margin:0 auto}
.res h3{margin:0 0 2px;font-size:20px;font-weight:900;letter-spacing:.08em}
.res .oc{font-size:13.5px;line-height:1.7;margin:4px 0 12px}
.res .x{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.res table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.res th,.res td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.res th:first-child,.res td:first-child{text-align:left;color:var(--sub);font-weight:700;white-space:nowrap}
.res thead th{font-size:13px}
.res .rate{height:5px;background:var(--line);margin-top:3px}
.res .rate i{display:block;height:100%}
.res h4{font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.08em;margin:12px 0 4px}
.res ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.75}
.res .src{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.6}
.spd{flex:none;height:46px;min-width:46px;padding:0 8px;border-radius:23px;border:none;background:var(--panel);color:var(--ink);font:700 12px "Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.spd.fast{color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.capmore{display:none}
.kindlegend{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kindlegend .k{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:var(--ink);white-space:nowrap;padding:4px 7px;border:1px solid color-mix(in srgb,var(--ink) 28%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--panel) 98%,transparent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.kindlegend .i{width:16px;height:16px;display:inline-block;border:2px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent);flex:none}
.kindlegend .fleet .i{clip-path:polygon(50% 0,100% 100%,50% 72%,0 100%)}
.kindlegend .ship .i{width:13px;height:6px;border-radius:50% 50% 25% 25%}
.kindlegend .infantry .i{border-radius:50%}
.kindlegend .cavalry .i{transform:rotate(45deg)}
.kindlegend .archer .i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.kindlegend .aircraft .i{clip-path:polygon(50% 0,100% 78%,62% 66%,50% 100%,38% 66%,0 78%)}
.kindlegend .ground_vehicle .i{width:14px;height:8px;border-radius:2px}
.kindlegend .fortress .i{border-radius:50%;box-shadow:0 0 0 2px currentColor inset}
.rangebadge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border:1px solid color-mix(in srgb,var(--ink) 26%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--panel) 98%,transparent);font-size:10px;font-weight:900;color:var(--sub);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rangebadge b{font-size:11px;color:var(--ink)}
.rangebadge.close{box-shadow:inset 3px 0 0 #e7a85b,0 1px 4px rgba(0,0,0,.12)}.rangebadge.close b{color:#d78628}
.rangebadge.far{box-shadow:inset 3px 0 0 #6fc8d6,0 1px 4px rgba(0,0,0,.12)}.rangebadge.far b{color:#3ba6b7}
.rangebadge.mixed{box-shadow:inset 3px 0 0 #d9c17a,0 1px 4px rgba(0,0,0,.12)}.rangebadge.mixed b{color:#a98b2d}
@media (max-width:600px){
 .title{top:max(6px,env(safe-area-inset-top,0px));left:8px;right:8px;writing-mode:horizontal-tb;display:flex;align-items:baseline;gap:8px;color:#f3f6fb;pointer-events:none}
 .title b{font-size:16px;letter-spacing:.04em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68vw}
 .title span{font-size:9px;letter-spacing:.03em;color:#b9c6da;white-space:nowrap}
 .force{top:calc(max(6px,env(safe-area-inset-top,0px)) + 26px);left:8px;width:calc(100% - 16px);padding:6px 8px 5px;font-size:10px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent)}
 .row{grid-template-columns:max-content minmax(56px,1fr) auto;gap:5px;margin:1px 0}.row .side{font-size:10.5px}.num{font-size:9px}
 .note{display:none}.kindlegend{gap:4px;margin-top:5px}.kindlegend .k{font-size:10px;gap:5px;padding:4px 6px}.kindlegend .i{width:14px;height:14px}.rangebadge{margin-top:5px;font-size:9px;padding:4px 7px}.rangebadge b{font-size:10px}.resbtn{margin-top:5px;font-size:10px;padding:1px 0}
 .cap{bottom:calc(100px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);padding:8px 10px 8px;max-height:none;overflow:visible;border-radius:10px;background:color-mix(in srgb,var(--panel) 90%,transparent)}
 .cap h2{font-size:15px;letter-spacing:.02em;margin:0 0 2px}.cap p{font-size:11.5px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
 .cap.expanded p{display:block;-webkit-line-clamp:unset;max-height:30vh;overflow-y:auto}
 .time{font-size:9px;gap:6px}.time b{font-size:11px}.capmore{display:block;margin:3px 0 0 auto;border:0;background:transparent;color:var(--acc);font:700 10px "Zen Kaku Gothic New",sans-serif;padding:2px 0;cursor:pointer}
 .seek{bottom:calc(58px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);height:28px;gap:6px;padding-inline:8px;border-radius:14px}.seek span{font-size:9px}
 .tl{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;left:8px;right:8px;justify-content:center;gap:6px}
 .steps{display:none}
 .play{width:42px;height:42px}.spd{height:42px;min-width:52px;padding:0 8px;font-size:10.5px}.cam{height:42px;min-width:58px;padding:0 8px;font-size:9.5px}
 .res{padding-left:10px;padding-right:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
 .res .in{overflow-x:hidden}.res table{font-size:11.5px}.res th,.res td{padding:6px 3px;overflow-wrap:anywhere}.res th:first-child,.res td:first-child{white-space:normal;min-width:4.5em}
}
@media (max-width:380px){
 .title b{max-width:62vw;font-size:15px}.title span{font-size:8px}
 .force{left:6px;width:calc(100% - 12px)}.cap{width:calc(100% - 12px)}
 .play{width:40px;height:40px}.spd{height:40px;min-width:48px}.cam{height:40px;min-width:54px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div class="hud">
    <div class="title"><b>北極海</b><span>作中年不明</span></div>
    <div class="force ui" aria-label="戦力">
      <div class="row e"><span class="side">米海軍</span><div class="bar"><i class="dep" id="eDep"></i><i class="fig" id="eFig"></i></div><span class="num" id="eNum"></span></div>
      <div class="row a"><span class="side">やまと</span><div class="bar"><i class="dep" id="aDep"></i><i class="fig" id="aFig"></i></div><span class="num" id="aNum"></span></div>
      <div class="note">配置は原作漫画にもとづく概略（推定）。部隊の大きさは戦力の目安。海面下の位置関係は抽象化</div>
      <div class="kindlegend" id="kindLegend" aria-label="兵種凡例"></div>
      <div class="rangebadge" id="rangeBadge" aria-label="現在の戦闘距離">戦闘距離 <b id="rangeMode">待機</b></div>
      <button class="resbtn" id="resOpen">戦果・損害を見る ›</button><a class="back" href="index.html#chinmoku">‹ 年表へ戻る</a>
    </div>
    <div class="res ui" id="res" role="dialog" aria-label="戦果"><div class="in" id="resIn"></div></div>
    <div class="cap ui" id="cap" aria-live="polite">
      <div class="time"><b id="cTime"></b><span id="cClock"></span></div>
      <h2 id="cTitle"></h2>
      <p id="cText"></p>
      <button class="capmore" id="capMore" type="button" aria-expanded="false">全文</button>
    </div>
    <div class="seek ui" aria-label="バトルフェイズ移動">
      <span id="seekNow">1 / 1</span>
      <input id="phaseSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="戦況をスライドして移動">
      <span id="seekLabel">—</span>
    </div>
    <div class="tl ui">
      <button class="play" id="play" aria-label="再生">▶</button>
      <div class="steps" id="steps"></div>
      <button class="spd" id="spd" aria-label="再生速度">1.0×</button>
      <button class="cam" id="cam" aria-label="カメラ自動追従の切替">自動<br>カメラ</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const hs=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03050a);
const cam=new THREE.PerspectiveCamera(42,1,.5,3000);

/* ---------- 宇宙 ---------- */
(function(){const n=4000,p=new Float32Array(n*3),c=new Float32Array(n*3);
 for(let i=0;i<n;i++){const u=hs(i,1)*2-1,t=hs(2,i)*6.283,r=900,s=Math.sqrt(1-u*u);p.set([r*s*Math.cos(t),r*u,r*s*Math.sin(t)],i*3);
  const b=.35+hs(i,5)*.65,w=hs(i,9);c.set([b*(w<.2?1:.8),b*.85,b*(w>.8?1:.8)],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true})))})();

const gc=document.createElement('canvas');gc.width=gc.height=128;
{const x=gc.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}
const glowTex=new THREE.CanvasTexture(gc);

const SUNL=new THREE.DirectionalLight(0xfff2dc,1.0);SUNL.position.set(80,120,40);scene.add(SUNL);
scene.add(new THREE.HemisphereLight(0xcfe0f0,0x4a4a3a,.75));

(function(){const S=260,N=110,g=new THREE.PlaneGeometry(S,S,N,N);g.rotateX(-Math.PI/2);const p=g.attributes.position,c=new Float32Array(p.count*3),lo=new THREE.Color(0x0e2438),hi=new THREE.Color(0x1e3c58),t=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);let h=0,f=.012,a=1;for(let o=0;o<4;o++){h+=a*(Math.sin(x*f+6*1.7+o)*Math.cos(z*f*1.3+6+o*2.1));f*=2.1;a*=.48}
  h=h*2+(-4);p.setY(i,h);t.copy(lo).lerp(hi,Math.min(1,Math.max(0,(h-(-4)+2)/(2*2))));c.set([t.r,t.g,t.b],i*3)}
 g.setAttribute('color',new THREE.BufferAttribute(c,3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));scene.add(m);const wat=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshLambertMaterial({color:0x1f4f78,transparent:true,opacity:.85}));wat.rotation.x=-Math.PI/2;wat.position.y=(-4)-.2;scene.add(wat);
 scene.background=new THREE.Color(0x5a7088);scene.fog=new THREE.Fog(0x5a7088,320,1100);})();

const SPECIAL={P:[{done:false,reset(){if(!this.done){this.done=true;{const l=sprite('ベーリング海峡〜北極海','',CSS.A,3*1.6);l.position.set(0,22,0);scene.add(l)}}}}],reset(i){this.P.forEach(p=>p.reset&&p.reset(i))},update(now,dt){this.P.forEach(p=>p.update&&p.update(now,dt));typeof beamsUpdate==="function"&&beamsUpdate(dt);}};


/* ---------- ラベル ---------- */
function makeTex(main,sub,col,fs){
 const dpr=2,c=document.createElement('canvas'),x=c.getContext('2d');
 const f1=`900 ${fs}px "Zen Kaku Gothic New", sans-serif`,f2=`700 ${Math.round(fs*.56)}px "Zen Kaku Gothic New", sans-serif`;
 const subLines=sub?sub.split(' / '):[];
 x.font=f1;const widths=[x.measureText(main).width];x.font=f2;subLines.forEach(t=>widths.push(x.measureText(t).width));
 const W=Math.ceil(Math.max(...widths)+26),Hh=Math.ceil(subLines.length?fs*(1.38+.62*subLines.length):fs*1.4);
 c.width=W*dpr;c.height=Hh*dpr;x.scale(dpr,dpr);
 x.fillStyle='rgba(6,10,18,.78)';x.fillRect(0,0,W,Hh);x.fillStyle=col;x.fillRect(0,0,3,Hh);
 x.textAlign='center';x.textBaseline='top';x.font=f1;x.fillStyle='#f2f5fa';x.fillText(main,W/2+1,fs*.16);
 if(subLines.length){x.font=f2;x.fillStyle=col;subLines.forEach((t,i)=>x.fillText(t,W/2+1,fs*(1.14+i*.62)))}
 const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;return {t,a:W/Hh};
}
function sprite(main,sub,col,scale){const {t,a}=makeTex(main,sub,col,30);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.center.set(.5,0);s.scale.set(scale*a,scale,1);s.userData.a=a;s.renderOrder=10;s.userData.scale=scale;return s}
function reSprite(s,main,sub,col){const {t,a}=makeTex(main,sub,col,30);s.material.map.dispose();s.material.map=t;s.material.needsUpdate=true;s.userData.a=a;s.scale.set(s.userData.scale*a,s.userData.scale,1)}


const U=[
{name:'米原潜部隊',cmd:'米海軍',side:'E',n:20,k:{0:{p:[0,7,-40],s:'ready',f:'line',l:'包囲'},1:{p:[0,7,-20],s:'fight',f:'concave'},2:{p:[0,7,-14],s:'fight',b:1},3:{p:[0,7,-30],s:'broken'},4:{p:[0,7,-40],s:'withdraw'}}},
{name:'やまと',cmd:'海江田四郎艦長',side:'A',n:3,k:{0:{p:[0,7,40],s:'move',l:'潜航'},1:{p:[0,7,10],s:'wait',nf:1,l:'沈黙'},2:{p:[6,7,-4],s:'charge',l:'反撃'},3:{p:[0,7,-10],s:'fight'},4:{p:[0,7,-60],s:'move',l:'離脱'}}}

 const sv=PH.length<=1?0:Math.round(i/(PH.length-1)*1000);phaseSeek.value=String(sv);phaseSeek.setAttribute('aria-valuenow',String(Math.round(sv/10)));phaseSeek.setAttribute('aria-valuetext',P.time+' '+P.title);

}


const SPEEDS=[1,1.5,2,3];
$('spd').onclick=()=>{SPEED=SPEEDS[(SPEEDS.indexOf(SPEED)+1)%SPEEDS.length];$('spd').textContent=SPEED.toFixed(1)+'×';$('spd').classList.toggle('fast',SPEED>1);$('spd').setAttribute('aria-label','再生速度 '+SPEED+'倍')};
/* ---------- 戦果パネル ---------- */

$('capMore').onclick=()=>{const c=$('cap'),on=c.classList.toggle('expanded');$('capMore').textContent=on?'閉じる':'全文';$('capMore').setAttribute('aria-expanded',String(on))};
/* ---------- ループ ---------- */
function resize(){const w=$('stage').clientWidth,h=$('stage').clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;const f=w<h?.24:.12;cam.setViewOffset(w,h*(1+f),0,h*f,w,h);cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('stage'));resize();
let last=performance.now()/1000,fireT=0;
const ok=s=>!['gone','wait','move','hidden'].includes(s.s);
function loop(){
 requestAnimationFrame(loop);
 const real=performance.now()/1000,dt=Math.min(.05,real-last)*SPEED;last=real;VT+=dt;const now=VT;
 if(playing){phaseT+=dt;if(phaseT>(phase===PH.length-1?12:10.5)){if(phase<PH.length-1)setPhase(phase+1);else{playing=false;updPlay();renderResult();$('res').classList.add('on')}}}
 // 艦隊
 units.forEach(o=>{
  const s=o.st[phase],p=Math.max(0,Math.min(1,(now-o.t0)/o.dur)),e=ease(p);
  const nx=o.f[0]+(o.t[0]-o.f[0])*e,ny=o.f[1]+(o.t[1]-o.f[1])*e,nz=o.f[2]+(o.t[2]-o.f[2])*e;
  const vx=nx-o.x,vz=nz-o.z;o.x=nx;o.y=ny;o.z=nz;
  let ty=s.h!=null?s.h*Math.PI/180:(o.side==='E'?0:Math.PI);if(Math.hypot(vx,vz)>.02)ty=Math.atan2(vx,vz);
  let dy=ty-o.yaw;while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;o.yaw+=dy*Math.min(1,dt*2);
  const baseSpread=s.r==='close'?.72:s.r==='far'?1.15:1,tsp=s.s==='broken'?2.4:s.s==='charge'?Math.min(.85,baseSpread):baseSpread;o.spread+=(tsp-o.spread)*dt*1.2;
  const col=colOf(s);o.mat.color.lerp(col,dt*2);o.mat.emissive.copy(o.mat.color).multiplyScalar(.35);
  o.mat.opacity+=(opOf(s)-o.mat.opacity)*dt*1.4;o.mesh.visible=o.mat.opacity>.02;
  const br=Math.max(0,o.spread-1),c=Math.cos(o.yaw),sn=Math.sin(o.yaw),f=s.fm||defForm(s),ring=f&&f.ring;
  if(!o.sp){o.sp=new Float32Array(o.n*3);o.init=true}
  const kk2=o.init?1:1-Math.exp(-dt*2.2),vd=Math.hypot(cam.position.x-o.x,cam.position.y-o.y,cam.position.z-o.z),vk=Math.min(1.45,Math.max(1,vd/210));let ax=0,az=0;
  for(let i=0;i<o.n;i++){const q=o.offs[i];let X,Y,Z,hy;
   if(ring){const [cx,cz,rr,a0,a1,w]=ring,row=i%3,j=Math.floor(i/3),m=Math.ceil(o.n/3),th=a0+(a1-a0)*(j/Math.max(1,m-1))+(reduce?0:w*(now-phaseStart)),R=rr+(row-1)*1.6;
    X=cx+Math.cos(th)*R;Z=cz+Math.sin(th)*R;Y=o.y+q[1]*.8;const sg=Math.sign(w||1);hy=Math.atan2(-Math.sin(th)*sg,Math.cos(th)*sg)}
   else{const fo=formOff(f,i,o.n,q),ox=fo[0]*o.spread+q[3]*br*6,oy=fo[1]*o.spread+q[4]*br*6,oz=fo[2]*o.spread+q[5]*br*6;
    X=o.x+ox*c+oz*sn;Y=o.y+oy;Z=o.z-ox*sn+oz*c;hy=o.yaw}
   if(!reduce){Y+=Math.sin(now*.8+i)*.12;if(s.s==='fight'){X+=Math.sin(now*1.3+i)*.15;Z+=Math.cos(now*1.1+i*2)*.15}}
   const k3=i*3,px=o.sp[k3],pz=o.sp[k3+2];o.sp[k3]+= (X-o.sp[k3])*kk2;o.sp[k3+1]+=(Y-o.sp[k3+1])*kk2;o.sp[k3+2]+=(Z-o.sp[k3+2])*kk2;
   const mvx=o.sp[k3]-px,mvz=o.sp[k3+2]-pz;if(!o.init&&Math.hypot(mvx,mvz)>.04)hy=Math.atan2(mvx,mvz);
   let d=hy-o.sy[i];while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;o.sy[i]=o.init?hy:o.sy[i]+d*Math.min(1,dt*3);
   dummy.position.set(o.sp[k3],o.sp[k3+1],o.sp[k3+2]);dummy.rotation.set(br?q[3]*br*2:0,o.sy[i],br?q[5]*br*2:0);
   const ks=(o.kind==='fleet'?1.24:o.kind==='ship'?1.52:o.kind==='aircraft'?1.62:o.kind==='ground_vehicle'?1.42:o.kind==='fortress'?1.82:o.kind==='cavalry'?1.38:o.kind==='archer'?1.28:1.22)*vk;dummy.scale.set(ks,ks,ks);dummy.updateMatrix();dummy.scale.set(1,1,1);o.mesh.setMatrixAt(i,dummy.matrix);
   o.wp[k3]=o.sp[k3];o.wp[k3+1]=o.sp[k3+1];o.wp[k3+2]=o.sp[k3+2];ax+=X;az+=Z}
  o.init=false;
  if(ring){o.x=ax/o.n;o.z=az/o.n}
  o.mesh.instanceMatrix.needsUpdate=true;
  if(o.lab){const kd=Math.min(3.15,Math.max(1.0,cam.position.distanceTo(o.lab.position)/105)),sc=o.lab.userData.scale*kd;o.lab.scale.set(sc*o.lab.userData.a,sc,1);o.lab.position.set(o.x,o.y+3.5+2*kd,o.z);o.lab.material.opacity=Math.min(1,o.mat.opacity*1.5);o.lab.visible=o.lab.material.opacity>.05}
 });
 // 砲火
 fireT-=dt;
 if(fireT<=0){fireT=.06;
  units.forEach(a=>{const sa=a.st[phase];if(!(sa.s==='fight'||sa.s==='charge'||sa.l==='殿')||a.mat.opacity<.4)return;
   if(sa.nf)return;
   let best=null,bd=52;units.forEach(b=>{if(b.side===a.side||b.mat.opacity<.2||!ok(b.st[phase]))return;const d=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);if(d<bd){bd=d;best=b}});
   if(!best)return;const shots=sa.b?5:2,mode=combatMode(a,best,sa,bd),col=a.side==='E'?EC:AC;
   for(let k=0;k<shots;k++){const i=Math.floor(Math.random()*a.n)*3,j=Math.floor(Math.random()*best.n)*3;
    const A=[a.wp[i],a.wp[i+1],a.wp[i+2]],B=[best.wp[j]+(Math.random()-.5)*2,best.wp[j+1]+(Math.random()-.5)*2,best.wp[j+2]+(Math.random()-.5)*2];
    if(mode==='close'){
      closeClash(A,B,col);if(a.kind==='fleet'||a.kind==='ship'||a.kind==='aircraft'){const C=[A[0]+(B[0]-A[0])*.38,A[1]+(B[1]-A[1])*.38,A[2]+(B[2]-A[2])*.38];beam(A,C,col)}
    }else if(a.kind==='archer'){arcShot(A,B,col)}
    else{beam(A,B,col);if(Math.random()<.42)boom(B,false,col)}
   }
  });
 }
 for(let k=0;k<BN;k++){const b=beams[k];let r=0,g=0,bl=0;if(b.life>0){b.life-=dt;const f=Math.max(0,b.life/b.max);r=b.c.r*f*1.8;g=b.c.g*f*1.8;bl=b.c.b*f*1.8}bCol.set([r,g,bl,r*.3,g*.3,bl*.3],k*6)}
 bGeo.attributes.position.needsUpdate=true;bGeo.attributes.color.needsUpdate=true;
 fx.forEach(f=>{if(!f.s.visible)return;f.life-=dt;if(f.life<=0){f.s.visible=false;return}const k=1-f.life/f.max,sc=f.s0+(f.s1-f.s0)*k;f.s.scale.set(sc,sc,1);f.s.material.opacity=1-k});
 for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.life-=dt;const k=1-Math.max(0,w.life/w.maxLife),sc=1+(w.max-1)*ease(k);w.m.scale.set(sc,sc,1);w.m.material.opacity=.9*(1-k);if(w.life<=0){scene.remove(w.m);w.m.geometry.dispose();waves.splice(i,1)}}
 for(let i=rangeFx.length-1;i>=0;i--){const x=rangeFx[i];x.life-=dt;x.o.material.opacity=Math.max(0,x.life/x.max);if(x.life<=0){scene.remove(x.o);x.o.geometry.dispose();rangeFx.splice(i,1)}}
 SPECIAL.update(now,dt);
 // 矢印
 arrows.forEach(a=>{const p=Math.max(0,Math.min(1,(now-a.t0)/1.8));a.line.geometry.setDrawRange(0,Math.floor(ease(p)*81));a.head.visible=p>=1});
 // カメラ
 if(auto&&playing&&!reduce)T.th+=dt*.015;
 const kk=1-Math.exp(-dt*(auto?.8:9));for(const key in T)C[key]+=(T[key]-C[key])*kk;
 const pr=Math.min(1.5,Math.max(1,1/Math.sqrt(cam.aspect*1.3))),r=C.r*pr;
 cam.position.set(C.tx+r*Math.sin(C.ph)*Math.sin(C.th),C.ty+r*Math.cos(C.ph),C.tz+r*Math.sin(C.ph)*Math.cos(C.th));
 cam.lookAt(C.tx,C.ty,C.tz);
 renderer.render(scene,cam);
}

const allText=U.map(u=>u.name+u.cmd).join('')+PH.map(p=>p.title).join('')+U.map(u=>Object.values(u.k).map(k=>k.l||'').join('')).join('')+'交戦突撃崩壊撤退移動中停止';
Promise.race([document.fonts.load('900 30px "Zen Kaku Gothic New"',allText).then(()=>document.fonts.load('700 17px "Zen Kaku Gothic New"',allText)).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]).then(()=>{
 units.forEach(o=>{const s=o.st[0];o.lab=sprite(o.name,subOf(o,s),CSS[o.side],2.7);o.labKey=subOf(o,s)+s.s;scene.add(o.lab)});
 setPhase(0);if(reduce)Object.assign(C,T);
});
setAuto(true);updPlay();loop();
