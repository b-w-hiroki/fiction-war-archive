 ['K','叛乱','カッファー叛乱勢力','不明','推定',['7-9 kaffer i','10 kaffer l']],
 ['K','叛乱','パルメレンド叛乱勢力','不明','推定',['7-9 palm i','10 palm l']],
 ['K','叛乱','シャンプール武装勢力','不明','推定',['7-8 champ i','9 champ l']]
].map((r,id)=>{const st={};r[5].forEach(s=>{const [rg,n,c]=s.split(' '),[a,b]=rg.split('-').map(Number);for(let t=a;t<=(b??a);t++)st[t]={n,c}});return {id,f:r[0],s:r[1],full:r[2],ships:r[3],src:r[4],st}});
const STW={i:'待機',m:'進軍',f:'交戦',l:'喪失・壊走',w:'後退',k:'司令官死去'};

/* ---------- 地図描画 ---------- */
const svg=$('map'),defs=el('defs',{},svg);
for(const f in MAPC){const g=el('radialGradient',{id:'g'+f},defs);el('stop',{offset:'0','stop-color':MAPC[f],'stop-opacity':'.55'},g);el('stop',{offset:'1','stop-color':MAPC[f],'stop-opacity':'0'},g)}
const blur=el('filter',{id:'blur',x:'-20%',y:'-50%',width:'140%',height:'200%'},defs);el('feGaussianBlur',{stdDeviation:'2.2'},blur);
const gal=el('radialGradient',{id:'gal'},defs);el('stop',{offset:'0','stop-color':'#2b3a63','stop-opacity':'.55'},gal);el('stop',{offset:'1','stop-color':'#070b14','stop-opacity':'0'},gal);
el('ellipse',{cx:50,cy:80,rx:70,ry:95,fill:'url(#gal)'},svg);
for(let i=0;i<220;i++)el('circle',{cx:hs(i,1)*100,cy:hs(2,i)*160,r:.12+hs(i,3)*.25,fill:'#fff',opacity:.25+hs(i,4)*.5},svg);
// 航行不能宙域（回廊以外）
const dz=el('g',{filter:'url(#blur)',opacity:.85},svg);
[[-5,19],[36,66],[85,110]].forEach(([a,b])=>el('rect',{x:a,y:68,width:b-a,height:17,fill:'#4a1f23'},dz));
el('text',{x:51,y:77.8,'text-anchor':'middle','font-size':2.6,fill:'#c99a9a','letter-spacing':'.3'},svg).textContent='航行不能宙域';
el('text',{x:3,y:6,'font-size':3.4,fill:'#e2c98f','font-weight':900,'letter-spacing':'.4'},svg).textContent='銀河帝国';
el('text',{x:3,y:156,'font-size':3.4,fill:'#9bdbe4','font-weight':900,'letter-spacing':'.4'},svg).textContent='自由惑星同盟';
const terr=el('g',{},svg),edges=el('g',{},svg),nodeG=el('g',{},svg),fxG=el('g',{},svg),chipG=el('g',{},svg);
EDGES.forEach(([a,b])=>{const A=NODES[a],B=NODES[b];el('line',{x1:A[1],y1:A[2],x2:B[1],y2:B[2],stroke:'#8fa3c7','stroke-width':.22,'stroke-dasharray':'.8 .8',opacity:.45},edges)});
const terrC={};
for(const k in NODES){const [nm,x,y,tp]=NODES[k];
 terrC[k]=el('circle',{cx:x,cy:y,r:13,fill:'url(#gE)'},terr);
 if(tp==='fort')el('rect',{x:x-1.3,y:y-1.3,width:2.6,height:2.6,transform:`rotate(45 ${x} ${y})`,fill:'#e8edf5',stroke:'#070b14','stroke-width':.3},nodeG);
 else if(tp==='cap'){el('circle',{cx:x,cy:y,r:1.8,fill:'none',stroke:'#e8edf5','stroke-width':.35},nodeG);el('circle',{cx:x,cy:y,r:.9,fill:'#e8edf5'},nodeG)}
 else el('circle',{cx:x,cy:y,r:.8,fill:'#e8edf5'},nodeG);
 const t=el('text',{x:x,y:y-2.6,'text-anchor':'middle','font-size':2.5,fill:'#dfe6f1','font-weight':700,'paint-order':'stroke',stroke:'#070b14','stroke-width':.7},nodeG);t.textContent=nm;
}
// 凡例
$('legend').innerHTML=['E','N','A','K','P'].map(f=>`<span><i style="background:${MAPC[f]}"></i>${FN[f].replace('（ローエングラム陣営）','')}</span>`).join('');

// 駒
const CW=11,CH=4.6;
const chips=P.map(p=>{
 const g=el('g',{class:'chip',tabindex:0,role:'button','aria-label':p.full},chipG);g.style.transition='transform 1.1s cubic-bezier(.5,0,.3,1), opacity .6s';
 const r=el('rect',{x:-CW/2,y:-CH/2,width:CW,height:CH,rx:.8,fill:MAPC[p.f],stroke:'#070b14','stroke-width':.3},g);
 const t=el('text',{x:0,y:1,'text-anchor':'middle','font-size':2.6,'font-weight':900,fill:'#0a0e17'},g);t.textContent=p.s;
 const x=el('path',{d:'M-3 -2.2L3 2.2M3 -2.2L-3 2.2',stroke:'#ff5a4a','stroke-width':.7,opacity:0},g);
 const k=el('text',{x:CW/2-.4,y:-CH/2+.2,'font-size':2.6,fill:'#fff','text-anchor':'middle',opacity:0},g);k.textContent='✝';
 g.addEventListener('click',()=>showDetail(p));g.addEventListener('keydown',e=>{if(e.key==='Enter')showDetail(p)});
 return {p,g,r,x,k,pos:null};
});

/* ---------- ターン描画 ---------- */
let turn=0,playing=false,timer=null;const UP=['amrit'];
function layout(t){
 const by={};P.forEach(p=>{const s=p.st[t];if(s)(by[s.n]=by[s.n]||[]).push(p)});
 const out={};
 for(const n in by){const list=by[n],cols=Math.min(list.length>12?5:list.length>6?4:3,list.length),[,x,y]=NODES[n],up=UP.includes(n);
  list.forEach((p,i)=>{const c=i%cols,r=Math.floor(i/cols),rowsLen=Math.min(cols,list.length-r*cols);
   let st=x-(rowsLen-1)/2*(CW+.8);st=Math.max(CW/2+.5,Math.min(100-CW/2-.5-(rowsLen-1)*(CW+.8),st));const cx=st+c*(CW+.8);
   out[p.id]=[cx,up?y-6.2-r*(CH+.8):y+4.6+r*(CH+.8)]})}
 return out;
}
function render(t){
 turn=t;const T=TURNS[t];
 $('dE').textContent=T.e;$('dA').textContent=T.a;$('evT').textContent=T.t;$('evX').textContent=T.x;
 $('slider').value=t;$('tno').textContent=(t+1)+'/13';
 for(const k in NODES){const f=own(k,t);terrC[k].setAttribute('fill','url(#g'+f+')')}
 const L=layout(t);
 chips.forEach(c=>{const s=c.p.st[t];
  if(!s){c.g.style.opacity=0;c.g.style.pointerEvents='none';return}
  const [x,y]=L[c.p.id];c.g.style.transform=`translate(${x}px,${y}px)`;c.g.style.opacity=1;c.g.style.pointerEvents='auto';
  c.r.style.opacity=s.c==='l'?.35:s.c==='w'||s.c==='k'?.7:1;
  c.x.setAttribute('opacity',s.c==='l'?1:0);c.k.setAttribute('opacity',s.c==='k'?1:0);
  c.r.setAttribute('stroke',s.c==='f'?'#fff':'#070b14');c.r.setAttribute('stroke-width',s.c==='f'?.45:.3);
 });
 fxG.innerHTML='';
 T.b.forEach(n=>{const [,x,y]=NODES[n];el('circle',{cx:x,cy:y,r:6,fill:'none',stroke:'#ff8a5c','stroke-width':.6,class:'pulse'},fxG);
  el('text',{x:x+2.6,y:y+1,'font-size':3.2,fill:'#ffb08a'},fxG).textContent='⚔'});
 const sites=$('sites');sites.innerHTML='';
 T.b.forEach(n=>{const b=document.createElement('button');b.textContent='⚔ '+NODES[n][0];b.onclick=()=>flash(n);sites.appendChild(b)});
 drawChart(t);
}
function flash(n){const [,x,y]=NODES[n];const c=el('circle',{cx:x,cy:y,r:5,fill:'none',stroke:'#fff','stroke-width':.8,class:'hl'},fxG);setTimeout(()=>c.remove(),2600)}
function showDetail(p){
 const s=p.st[turn];const col=css('--'+p.f)||MAPC[p.f];
 $('detail').innerHTML=`<b>${p.full}</b><span class="tag" style="color:${col}">${FN[p.f]}</span><br>艦艇：${p.ships}<br>このターンの状況：${s?(NODES[s.n][0]+'／'+STW[s.c]):'—'}<br>配置・動向の根拠：${p.src==='原作'?'兵力は原作に記述あり':'推定を含む'}`;
}

/* ---------- 推移グラフ ---------- */
const counts=TURNS.map((_,t)=>{const c={E:0,N:0,A:0,K:0};P.forEach(p=>{const s=p.st[t];if(s&&s.c!=='l'&&p.s!=='首飾'&&p.s!=='叛乱')c[p.f]++});return c});
function drawChart(t){
 const g=$('chart');g.innerHTML='';const X=i=>22+i*(270/12),Y=v=>98-v*(84/14);
 const tc=css('--sub'),lc=css('--line');
 [0,5,10].forEach(v=>{el('line',{x1:22,x2:292,y1:Y(v),y2:Y(v),stroke:lc,'stroke-width':.8},g);el('text',{x:16,y:Y(v)+3,'font-size':9,fill:tc,'text-anchor':'end','font-family':'Barlow Condensed'},g).textContent=v});
 [0,4,7,11].forEach(i=>el('text',{x:X(i),y:112,'font-size':8.5,fill:tc,'text-anchor':'middle','font-family':'Barlow Condensed'},g).textContent=TURNS[i].e.replace('帝国暦','').replace('年','.').replace(/月.*/,''));
 el('line',{x1:X(t),x2:X(t),y1:10,y2:100,stroke:css('--acc'),'stroke-width':1.2},g);
 ['E','N','A','K'].forEach(f=>{const col=css('--'+f);const pts=counts.map((c,i)=>X(i)+','+Y(c[f])).join(' ');
  el('polyline',{points:pts,fill:'none',stroke:col,'stroke-width':1.8,'stroke-linejoin':'round',opacity:.95},g);
  el('circle',{cx:X(t),cy:Y(counts[t][f]),r:3,fill:col},g)});
 const lg=[['E','帝国'],['N','貴族連合'],['A','同盟'],['K','救国軍事会議']];
 lg.forEach(([f,n],i)=>{el('rect',{x:26+i*68,y:2,width:8,height:4,fill:css('--'+f)},g);el('text',{x:37+i*68,y:7,'font-size':8.5,fill:css('--ink')},g).textContent=`${n} ${counts[t][f]}`});
}

/* ---------- 操作 ---------- */
function go(t){render(Math.max(0,Math.min(12,t)))}
function setPlay(v){playing=v;$('play').textContent=v?'❚❚':'▶';$('play').setAttribute('aria-label',v?'一時停止':'再生');clearInterval(timer);
 if(v){if(turn===12)go(0);timer=setInterval(()=>{if(turn>=12)setPlay(false);else go(turn+1)},4500)}}
$('prev').onclick=()=>{setPlay(false);go(turn-1)};$('next').onclick=()=>{setPlay(false);go(turn+1)};
$('play').onclick=()=>setPlay(!playing);
$('slider').oninput=e=>{setPlay(false);go(+e.target.value)};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawChart(turn));
render(0);
})();
</script>
</body>
</html>
