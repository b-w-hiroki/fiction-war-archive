<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>要塞対要塞 3D俯瞰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#05070c;--panel:rgba(236,240,246,.92);--ink:#10151f;--sub:#4d5668;--line:rgba(16,21,31,.16);--emp:#b8841a;--all:#1b8ea2;--acc:#b8841a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(9,13,22,.8);--ink:#e6ecf5;--sub:#9aa6ba;--line:rgba(230,236,245,.16);--emp:#e8b44c;--all:#58c7d8;--acc:#e8b44c}}
:root[data-theme="dark"]{--panel:rgba(9,13,22,.8);--ink:#e6ecf5;--sub:#9aa6ba;--line:rgba(230,236,245,.16);--emp:#e8b44c;--all:#58c7d8;--acc:#e8b44c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none}
.hud .ui{pointer-events:auto}
.title{position:absolute;top:10px;right:12px;writing-mode:vertical-rl;color:#f3f6fb;text-shadow:0 0 14px rgba(120,170,255,.45);display:flex;gap:6px}
.title b{font-size:30px;font-weight:900;letter-spacing:.18em;line-height:1}
.title span{font-size:11px;letter-spacing:.2em;font-weight:700;color:#b9c6da}
.force{position:absolute;top:10px;left:10px;width:min(68vw,330px);background:var(--panel);padding:8px 10px 7px;border-radius:4px;font-size:11.5px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:max-content 1fr 7.6em;align-items:center;gap:6px;margin:2px 0}
.row .side{font-weight:900;font-size:12.5px;white-space:nowrap}
.row.e .side{color:var(--emp)}.row.a .side{color:var(--all)}
.bar{position:relative;height:6px;background:var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .9s ease}
.row.e .dep{background:var(--emp);opacity:.33}.row.e .fig{background:var(--emp)}
.row.a .dep{background:var(--all);opacity:.33}.row.a .fig{background:var(--all)}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--sub);white-space:nowrap}
.num b{color:var(--ink)}
.note{color:var(--sub);font-size:10.5px;margin-top:3px;line-height:1.5}
.cap{position:absolute;left:0;right:0;margin:0 auto;bottom:66px;width:calc(100% - 20px);max-width:620px;box-sizing:border-box;background:var(--panel);border-radius:4px;padding:10px 14px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--line)}
.cap.in{animation:capIn .6s ease}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.time{display:flex;gap:10px;align-items:baseline;color:var(--acc);font-weight:700;font-size:12px}
.time b{font-size:14px;font-weight:900;letter-spacing:.08em}
.cap h2{font-weight:900;font-size:20px;margin:1px 0 4px;letter-spacing:.1em}
.cap p{margin:0;font-size:13.5px;line-height:1.72}
.tl{position:absolute;left:0;right:0;margin:0 auto;bottom:10px;width:calc(100% - 20px);max-width:620px;display:flex;gap:4px;align-items:center}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--acc);color:#0b0f18;font-size:15px;cursor:pointer}
.steps{flex:1;display:flex;gap:2px;background:var(--panel);border-radius:23px;padding:4px;height:46px;box-sizing:border-box;box-shadow:0 0 0 1px var(--line)}
.steps button{flex:1;min-width:0;border:none;background:transparent;border-radius:19px;font:700 11px "Zen Kaku Gothic New",sans-serif;color:var(--sub);padding:0;cursor:pointer;white-space:nowrap}
.steps button.done{color:var(--ink)}
.steps button.on{background:var(--ink);color:var(--panel)}
.cam{flex:none;height:46px;padding:0 11px;border-radius:23px;border:none;background:var(--panel);color:var(--ink);font:700 11px "Zen Kaku Gothic New",sans-serif;cursor:pointer;box-shadow:0 0 0 1px var(--line);line-height:1.25}
.cam.off{color:var(--sub)}
.resbtn{display:block;margin-top:5px;width:100%;border:none;background:transparent;color:var(--acc);font:700 11.5px "Zen Kaku Gothic New",sans-serif;text-align:right;padding:2px 0;cursor:pointer}
.res{position:absolute;inset:0;z-index:5;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;display:none}
.res.on{display:block;animation:capIn .4s ease}
.res .in{max-width:620px;margin:0 auto}
.res h3{margin:0 0 2px;font-size:20px;font-weight:900;letter-spacing:.08em}
.res .oc{font-size:13.5px;line-height:1.7;margin:4px 0 12px}
.res .x{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.res table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.res th,.res td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.res th:first-child,.res td:first-child{text-align:left;color:var(--sub);font-weight:700;white-space:nowrap}
.res thead th{font-size:13px}
.res .rate{height:5px;background:var(--line);margin-top:3px}
.res .rate i{display:block;height:100%}
.res h4{font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.08em;margin:12px 0 4px}
.res ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.75}
.res .src{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.6}
.spd{flex:none;height:46px;min-width:46px;padding:0 8px;border-radius:23px;border:none;background:var(--panel);color:var(--ink);font:700 12px "Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.spd.fast{color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:420px){.cap h2{font-size:18px}.cap p{font-size:13px}.title b{font-size:26px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div class="hud">
    <div class="title"><b>要塞対要塞</b><span>宇宙暦798年／帝国暦489年</span></div>
    <div class="force ui" aria-label="戦力">
      <div class="row e"><span class="side">帝国軍</span><div class="bar"><i class="dep" id="eDep"></i><i class="fig" id="eFig"></i></div><span class="num" id="eNum"></span></div>
      <div class="row a"><span class="side">同盟軍</span><div class="bar"><i class="dep" id="aDep"></i><i class="fig" id="aFig"></i></div><span class="num" id="aNum"></span></div>
      <div class="note">交戦中／健在の部隊数。帝国はガイエスブルク要塞＋ケンプ・ミュラー艦隊。展開は原作小説にもとづく概略</div>
      <button class="resbtn" id="resOpen">戦果・損害を見る ›</button>
    </div>
    <div class="res ui" id="res" role="dialog" aria-label="戦果"><div class="in" id="resIn"></div></div>
    <div class="cap ui" id="cap" aria-live="polite">
      <div class="time"><b id="cTime"></b><span id="cClock"></span></div>
      <h2 id="cTitle"></h2>
      <p id="cText"></p>
    </div>
    <div class="tl ui">
      <button class="play" id="play" aria-label="再生">▶</button>
      <div class="steps" id="steps"></div>
      <button class="spd" id="spd" aria-label="再生速度">1.0×</button>
      <button class="cam" id="cam" aria-label="カメラ自動追従の切替">自動<br>カメラ</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const hs=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();scene.background=new THREE.Color(0x03050a);

/* ---------- 宇宙 ---------- */
(function(){const n=4000,p=new Float32Array(n*3),c=new Float32Array(n*3);
 for(let i=0;i<n;i++){const u=hs(i,1)*2-1,t=hs(2,i)*6.283,r=900,s=Math.sqrt(1-u*u);p.set([r*s*Math.cos(t),r*u,r*s*Math.sin(t)],i*3);
  const b=.35+hs(i,5)*.65,w=hs(i,9);c.set([b*(w<.2?1:.8),b*.85,b*(w>.8?1:.8)],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true})))})();

const gc=document.createElement('canvas');gc.width=gc.height=128;
{const x=gc.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}
const glowTex=new THREE.CanvasTexture(gc);

const STAR=new THREE.Vector3(150,60,-200);
const sunM=new THREE.Mesh(new THREE.SphereGeometry(26,48,32),new THREE.MeshBasicMaterial({color:0xfff0d8}));sunM.position.copy(STAR);scene.add(sunM);
[[160,0xffd8a0,.7],[280,0xffd8a0,.3]].forEach(([s,c,o])=>{const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));g.scale.set(s,s,1);g.position.copy(STAR);scene.add(g)});
const pl=new THREE.PointLight(0xfff0d8,1.2,0);pl.position.copy(STAR);scene.add(pl);
scene.add(new THREE.AmbientLight(0x4a5a78,.6));
const fill=new THREE.DirectionalLight(0x9fb6ff,.35);fill.position.set(60,80,-80);scene.add(fill);

// 回廊の壁（航行不能宙域）
(function(){const n=2600,p=new Float32Array(n*3),c=new Float32Array(n*3);for(let i=0;i<n;i++){const sd=i%2?1:-1,x=sd*(62+hs(i,31)*30),y=(hs(32,i)-.5)*70,z=(hs(i,33)-.5)*260;p.set([x,y,z],i*3);const b=.25+hs(i,34)*.3;c.set([b,b*.35,b*.3],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.1,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})))})();
// 要塞
const ISER=new THREE.Mesh(new THREE.SphereGeometry(11,48,32),new THREE.MeshLambertMaterial({color:0xcfd6df,emissive:0x1a2430}));ISER.position.set(0,0,40);scene.add(ISER);
const GAI=new THREE.Group();scene.add(GAI);
GAI.add(new THREE.Mesh(new THREE.SphereGeometry(9.5,40,28),new THREE.MeshLambertMaterial({color:0x8f8b84,emissive:0x1d1810})));
const engM=new THREE.MeshBasicMaterial({color:0x9ad0ff});
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,e=new THREE.Mesh(new THREE.CylinderGeometry(.9,1.3,3.2,10),new THREE.MeshLambertMaterial({color:0x5e5a54}));e.position.set(Math.cos(a)*9.6,0,Math.sin(a)*9.6);e.rotation.z=Math.PI/2;e.rotation.y=-a;GAI.add(e);
 const f=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x9ad0ff,transparent:true,opacity:.0,blending:THREE.AdditiveBlending,depthWrite:false}));f.position.set(Math.cos(a)*11.6,0,Math.sin(a)*11.6);f.scale.set(3,3,1);GAI.add(f)}
GAI.position.set(0,0,-62);
function cannon(a,b,col,w){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(w,w,L,12,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));
 m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m);return {m,life:1.1}}


const SPECIAL={beams:[],lab:null,shot:0,boom:false,
 reset(i){if(!this.lab){this.lab=[[ISER,'イゼルローン要塞','同盟'],[GAI,'ガイエスブルク要塞','帝国']].map(([o,n,s])=>{const sp=sprite(n,s==='同盟'?'雷神の槌':'移動要塞',s==='同盟'?CSS.A:CSS.E,3.2);scene.add(sp);return {o,sp}})}
  this.shot=0;this.boom=false;GAI.visible=true;GAI.rotation.set(0,0,0);if(i<4)GAI.position.set(0,0,-62);if(i===4)GAI.position.set(0,0,-62)},
 update(now,dt){const t=now-phaseStart;
  if(phase===4){const k=Math.min(1,t/7);GAI.position.z=-62+26*ease(k);GAI.children.forEach(c=>{if(c.isSprite)c.material.opacity=.9})}
  else if(phase===5){GAI.position.z=-36;const spin=Math.min(4,t*.6);GAI.rotation.y+=dt*spin;GAI.rotation.z=Math.sin(now*3)*.2*Math.min(1,t/3);
   if(t>6&&this.shot<1){this.shot=1;this.beams.push(cannon(ISER.position,GAI.position,0xbfe8ff,1.6))}
   if(t>6.5&&!this.boom){this.boom=true;for(let k=0;k<14;k++)boom([GAI.position.x+(Math.random()-.5)*16,(Math.random()-.5)*10,GAI.position.z+(Math.random()-.5)*16],true,0xffb070);GAI.visible=false}}
  else if(phase===6){GAI.visible=false}
  else{GAI.children.forEach(c=>{if(c.isSprite)c.material.opacity=0})}
  if(phase===1&&t>1.2){const n=Math.floor((t-1.2)/3.2);if(n>=this.shot&&n<3){this.shot=n+1;const a=n%2?ISER.position:GAI.position,b=n%2?GAI.position:ISER.position;this.beams.push(cannon(a,b,n%2?0xbfe8ff:0xffd080,1.3));boom([b.x,b.y,b.z],true)}}
  this.beams=this.beams.filter(b=>{b.life-=dt;b.m.material.opacity=Math.max(0,b.life);if(b.life<=0){scene.remove(b.m);b.m.geometry.dispose();return false}return true});
  if(this.lab)this.lab.forEach(l=>{l.sp.position.set(l.o.position.x,l.o.position.y+13,l.o.position.z);l.sp.visible=l.o.visible})}};



/* ---------- ラベル ---------- */
function makeTex(main,sub,col,fs){
 const dpr=2,c=document.createElement('canvas'),x=c.getContext('2d');
 const f1=`900 ${fs}px "Zen Kaku Gothic New", sans-serif`,f2=`700 ${Math.round(fs*.56)}px "Zen Kaku Gothic New", sans-serif`;
 x.font=f1;const w1=x.measureText(main).width;x.font=f2;const w2=sub?x.measureText(sub).width:0;
 const W=Math.ceil(Math.max(w1,w2)+26),Hh=Math.ceil(sub?fs*1.95:fs*1.4);
 c.width=W*dpr;c.height=Hh*dpr;x.scale(dpr,dpr);
 x.fillStyle='rgba(6,10,18,.78)';x.fillRect(0,0,W,Hh);x.fillStyle=col;x.fillRect(0,0,3,Hh);
 x.textAlign='center';x.textBaseline='top';x.font=f1;x.fillStyle='#f2f5fa';x.fillText(main,W/2+1,fs*.16);
 if(sub){x.font=f2;x.fillStyle=col;x.fillText(sub,W/2+1,fs*1.22)}
 const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;return {t,a:W/Hh};
}
function sprite(main,sub,col,scale){const {t,a}=makeTex(main,sub,col,30);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.center.set(.5,0);s.scale.set(scale*a,scale,1);s.userData.a=a;s.renderOrder=10;s.userData.scale=scale;return s}
function reSprite(s,main,sub,col){const {t,a}=makeTex(main,sub,col,30);s.material.map.dispose();s.material.map=t;s.material.needsUpdate=true;s.userData.a=a;s.scale.set(s.userData.scale*a,s.userData.scale,1)}


const U=[
 {name:'ケンプ艦隊',cmd:'ケンプ',side:'E',n:50,k:{0:{p:[-10,0,-48],s:'ready',l:'要塞とともに出現'},1:{p:[-10,0,-26],s:'fight',l:''},4:{p:[-12,0,-24],l:'要塞を護衛'},5:{s:'broken',l:'要塞とともに壊滅'},6:{s:'gone'}}},
 {name:'ミュラー艦隊',cmd:'ミュラー',side:'E',n:45,k:{0:{p:[12,0,-50],s:'ready'},1:{p:[12,0,-30],s:'fight'},2:{p:[18,8,62],s:'charge',l:'要塞の背後へ回り込む'},3:{p:[16,8,60],s:'fight',l:'逆撃を受ける'},4:{p:[14,2,-22],s:'fight',l:''},5:{l:''},6:{p:[0,0,-120],s:'withdraw',l:'残存艦を率い撤退'}}},
 {name:'駐留艦隊',cmd:'メルカッツ',side:'A',n:40,k:{0:{p:[-14,0,28],s:'ready',l:'キャゼルヌが要塞司令官代理'},1:{p:[-12,0,14],s:'fight',l:''},2:{p:[-10,0,30],l:'要塞へ後退'},3:{p:[28,12,50],s:'charge',l:'囮で誘い込み逆撃',f:'wedge'},4:{p:[-8,0,18],s:'fight',l:''},6:{s:'wait'}}},
 {name:'駐留艦隊・分艦隊',cmd:'アッテンボロー',side:'A',n:35,k:{0:{p:[14,0,28],s:'ready'},1:{p:[12,0,14],s:'fight'},2:{p:[10,0,30]},3:{p:[8,2,62],s:'fight',l:'背後で迎え撃つ',f:'concave',h:150},4:{p:[10,0,18],l:''},6:{s:'wait'}}},
 {name:'ヤン救援艦隊',cmd:'ヤン',side:'A',n:45,k:{0:{p:[70,10,-140],s:'hidden'},5:{p:[22,4,-52],s:'fight',l:'推進機1基に集中砲火',b:1,f:'concave',h:-120},6:{p:[24,4,-46],s:'wait',l:''}}}
];
const PH=[
 {time:'4月10日',clock:'出現',step:'出現',title:'要塞がワープしてくる',text:'ヤンが首都で査問会に呼び出されている隙に、帝国軍はワープ機関を取り付けたガイエスブルク要塞をイゼルローン回廊へ送り込んだ。司令官はケンプ、副司令官はミュラー。要塞はキャゼルヌが代理で預かっていた。',cam:{t:[0,0,-10],r:170,th:.6,ph:1.1},arrows:[]},
 {time:'4月',clock:'序盤',step:'主砲',title:'主砲の撃ち合い',text:'ガイエスブルクの主砲とイゼルローンの「雷神の槌」が撃ち合い、両軍の艦隊が要塞の間でぶつかる。要塞同士の戦いは前例のないものだった。',cam:{t:[0,0,-12],r:170,th:.3,ph:.8},arrows:[]},
 {time:'4月',clock:'中盤',step:'背後',title:'ミュラーの迂回',text:'ミュラーの艦隊が要塞の裏側へ回り込み、防御の隙を突く。正面だけを見ていた守備側は対応に追われた。',cam:{t:[10,4,20],r:150,th:-.5,ph:1.0},arrows:[{p:[[12,0,-30],[38,10,10],[18,8,62]],c:'E'}]},

   if(ring){const [cx,cz,rr,a0,a1,w]=ring,row=i%3,j=Math.floor(i/3),m=Math.ceil(o.n/3),th=a0+(a1-a0)*(j/Math.max(1,m-1))+(reduce?0:w*(now-phaseStart)),R=rr+(row-1)*1.6;
    X=cx+Math.cos(th)*R;Z=cz+Math.sin(th)*R;Y=o.y+q[1]*.8;const sg=Math.sign(w||1);hy=Math.atan2(-Math.sin(th)*sg,Math.cos(th)*sg)}
   else{const fo=formOff(f,i,o.n,q),ox=fo[0]*o.spread+q[3]*br*6,oy=fo[1]*o.spread+q[4]*br*6,oz=fo[2]*o.spread+q[5]*br*6;
    X=o.x+ox*c+oz*sn;Y=o.y+oy;Z=o.z-ox*sn+oz*c;hy=o.yaw}
   if(!reduce){Y+=Math.sin(now*.8+i)*.12;if(s.s==='fight'){X+=Math.sin(now*1.3+i)*.15;Z+=Math.cos(now*1.1+i*2)*.15}}
   const k3=i*3,px=o.sp[k3],pz=o.sp[k3+2];o.sp[k3]+= (X-o.sp[k3])*kk2;o.sp[k3+1]+=(Y-o.sp[k3+1])*kk2;o.sp[k3+2]+=(Z-o.sp[k3+2])*kk2;
   const mvx=o.sp[k3]-px,mvz=o.sp[k3+2]-pz;if(!o.init&&Math.hypot(mvx,mvz)>.04)hy=Math.atan2(mvx,mvz);
   let d=hy-o.sy[i];while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;o.sy[i]=o.init?hy:o.sy[i]+d*Math.min(1,dt*3);
   dummy.position.set(o.sp[k3],o.sp[k3+1],o.sp[k3+2]);dummy.rotation.set(br?q[3]*br*2:0,o.sy[i],br?q[5]*br*2:0);dummy.updateMatrix();o.mesh.setMatrixAt(i,dummy.matrix);
   o.wp[k3]=o.sp[k3];o.wp[k3+1]=o.sp[k3+1];o.wp[k3+2]=o.sp[k3+2];ax+=X;az+=Z}
  o.init=false;
  if(ring){o.x=ax/o.n;o.z=az/o.n}
  o.mesh.instanceMatrix.needsUpdate=true;
  if(o.lab){const kd=Math.min(2.8,Math.max(.85,cam.position.distanceTo(o.lab.position)/110)),sc=o.lab.userData.scale*kd;o.lab.scale.set(sc*o.lab.userData.a,sc,1);o.lab.position.set(o.x,o.y+3.5+2*kd,o.z);o.lab.material.opacity=Math.min(1,o.mat.opacity*1.5);o.lab.visible=o.lab.material.opacity>.05}
 });
 // 砲火
 fireT-=dt;
 if(fireT<=0){fireT=.06;
  units.forEach(a=>{const sa=a.st[phase];if(!(sa.s==='fight'||sa.s==='charge'||sa.l==='殿')||a.mat.opacity<.4)return;
   if(sa.nf)return;
   let best=null,bd=52;units.forEach(b=>{if(b.side===a.side||b.mat.opacity<.2||!ok(b.st[phase]))return;const d=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);if(d<bd){bd=d;best=b}});
   if(!best)return;const shots=sa.b?5:2;
   for(let k=0;k<shots;k++){const i=Math.floor(Math.random()*a.n)*3,j=Math.floor(Math.random()*best.n)*3;
    const A=[a.wp[i],a.wp[i+1],a.wp[i+2]],B=[best.wp[j]+(Math.random()-.5)*2,best.wp[j+1]+(Math.random()-.5)*2,best.wp[j+2]+(Math.random()-.5)*2];
    beam(A,B,a.side==='E'?EC:AC);if(Math.random()<.35)boom(B,best.st[phase].s==='broken'&&Math.random()<.4)}
  });
 }
 for(let k=0;k<BN;k++){const b=beams[k];let r=0,g=0,bl=0;if(b.life>0){b.life-=dt;const f=Math.max(0,b.life/b.max);r=b.c.r*f*1.4;g=b.c.g*f*1.4;bl=b.c.b*f*1.4}bCol.set([r,g,bl,r*.3,g*.3,bl*.3],k*6)}
 bGeo.attributes.position.needsUpdate=true;bGeo.attributes.color.needsUpdate=true;
 fx.forEach(f=>{if(!f.s.visible)return;f.life-=dt;if(f.life<=0){f.s.visible=false;return}const k=1-f.life/f.max,sc=f.s0+(f.s1-f.s0)*k;f.s.scale.set(sc,sc,1);f.s.material.opacity=1-k});
 SPECIAL.update(now,dt);
 // 矢印
 arrows.forEach(a=>{const p=Math.max(0,Math.min(1,(now-a.t0)/1.8));a.line.geometry.setDrawRange(0,Math.floor(ease(p)*81));a.head.visible=p>=1});
 // カメラ
 if(auto&&playing&&!reduce)T.th+=dt*.015;
 const kk=1-Math.exp(-dt*(auto?.8:9));for(const key in T)C[key]+=(T[key]-C[key])*kk;
 const pr=Math.min(1.5,Math.max(1,1/Math.sqrt(cam.aspect*1.3))),r=C.r*pr;
 cam.position.set(C.tx+r*Math.sin(C.ph)*Math.sin(C.th),C.ty+r*Math.cos(C.ph),C.tz+r*Math.sin(C.ph)*Math.cos(C.th));
 cam.lookAt(C.tx,C.ty,C.tz);
 renderer.render(scene,cam);
}

/* ---------- 起動 ---------- */
const allText=U.map(u=>u.name+u.cmd).join('')+PH.map(p=>p.title).join('')+U.map(u=>Object.values(u.k).map(k=>k.l||'').join('')).join('')+'交戦突撃崩壊撤退移動中停止';
Promise.race([document.fonts.load('900 30px "Zen Kaku Gothic New"',allText).then(()=>document.fonts.load('700 17px "Zen Kaku Gothic New"',allText)).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]).then(()=>{
 units.forEach(o=>{const s=o.st[0];o.lab=sprite(o.name,subOf(o,s),CSS[o.side],2.7);o.labKey=subOf(o,s)+s.s;scene.add(o.lab)});
 setPhase(0);if(reduce)Object.assign(C,T);
 setTimeout(()=>{playing=true;updPlay()},2800);
});
setAuto(true);updPlay();loop();
})();
</script>
